[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-search-engine"
version = "0.1.0"
description = "Production-oriented mini search engine with offline indexing and BM25"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flask==3.1.2",
  "flask-cors==6.0.1",
  "beautifulsoup4==4.14.2",
  "requests==2.32.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.3",
  "black==25.9.0",
  "mypy==1.18.2",
]

[project.scripts]
mini-search-engine = "mini_search_engine.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
